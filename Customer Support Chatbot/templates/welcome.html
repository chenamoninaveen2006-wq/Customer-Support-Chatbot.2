<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Atlas</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #e0e7ff 0%, #ede9fe 100%);
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .start-container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        .start-container h1 {
            color: #4f46e5;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        .start-container p {
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .start-btn {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }
    </style>
</head>
<body>
    <div class="start-container">
        <h1>Atlas AI</h1>
        <p>Your intelligent, empathetic customer support assistant. Ready to help you seamlessly.</p>
        <a href="/login" class="start-btn">Get Started 🚀</a>
    </div>
</body>
</html>
